  locked=Array.from({length:N},()=>Array(N).fill(false));
  for(const [r,c] of pic.v){st[r][c]=sol[r][c]?1:2;locked[r][c]=true}
  rc=sol.map(r=>clues(r));cc=[];for(let c=0;c<N;c++)cc.push(clues(sol.map(r=>r[c])));
  solved=false;shown=false;wrong=null;document.getElementById('win').style.display='none';msg('');
  layout();
}
let cs=30,ox=0,oy=0,gw=0,gh=0,cluW=0,cluH=0;
function layout(){
  const st_=document.getElementById('stage'),W=st_.clientWidth,H=st_.clientHeight;
  const maxR=Math.max(...rc.map(a=>a.length)),maxC=Math.max(...cc.map(a=>a.length));
  // unit = cell size; clue cell ~0.62 of unit
  const k=0.62;
  cs=Math.floor(Math.min(W/(N+maxR*k+0.3),H/(N+maxC*k+0.3),64));
  cluW=Math.round(maxR*cs*k);cluH=Math.round(maxC*cs*k);
  gw=cluW+cs*N;gh=cluH+cs*N;
  const dpr=window.devicePixelRatio||1;
  cv.style.width=gw+'px';cv.style.height=gh+'px';cv.width=gw*dpr;cv.height=gh*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
function lineDone(arr,clue){return JSON.stringify(clues(arr.map(v=>v===1?1:0)))===JSON.stringify(clue)}
function draw(){
  ctx.clearRect(0,0,gw,gh);
  const fs=Math.max(10,Math.floor(cs*0.46));
  ctx.font='600 '+fs+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const ku=cs*0.62;
  // clues
  for(let r=0;r<N;r++){const done=lineDone(st[r],rc[r]),cl=rc[r];
    cl.forEach((n,i)=>{ctx.fillStyle=done?'#5b6b8c':CREAM;ctx.fillText(n,cluW-(cl.length-i-0.5)*ku,cluH+r*cs+cs/2)})}
  for(let c=0;c<N;c++){const done=lineDone(st.map(r=>r[c]),cc[c]),cl=cc[c];
    cl.forEach((n,i)=>{ctx.fillStyle=done?'#5b6b8c':CREAM;ctx.fillText(n,cluW+c*cs+cs/2,cluH-(cl.length-i-0.5)*ku)})}
  // cells
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const x=cluW+c*cs,y=cluH+r*cs;
    ctx.fillStyle=(Math.floor(r/5)+Math.floor(c/5))%2?'#1b2d52':'#16264a';ctx.fillRect(x,y,cs,cs);
    const v=shown?(sol[r][c]?1:0):st[r][c];
    if(v===1){ctx.fillStyle=shown?GOLD:CREAM;ctx.fillRect(x+1,y+1,cs-2,cs-2)}
    else if(v===2){ctx.strokeStyle='#7f8fb3';ctx.lineWidth=2;ctx.beginPath();const m=cs*0.28;ctx.moveTo(x+m,y+m);ctx.lineTo(x+cs-m,y+cs-m);ctx.moveTo(x+cs-m,y+m);ctx.lineTo(x+m,y+cs-m);ctx.stroke()}
    if(locked[r][c]&&!shown){ // given marker
      ctx.strokeStyle=GOLD;ctx.lineWidth=Math.max(2,cs*0.07);ctx.strokeRect(x+2,y+2,cs-4,cs-4);
      if(v===2){ctx.strokeStyle=GOLD;ctx.lineWidth=2.5;ctx.beginPath();const m=cs*0.28;ctx.moveTo(x+m,y+m);ctx.lineTo(x+cs-m,y+cs-m);ctx.moveTo(x+cs-m,y+m);ctx.lineTo(x+m,y+cs-m);ctx.stroke()}
    }
    if(wrong&&wrong[r][c]){ctx.fillStyle='rgba(200,16,46,.75)';ctx.fillRect(x+1,y+1,cs-2,cs-2)}
  }
  // grid lines
  for(let i=0;i<=N;i++){const th=i%5===0;ctx.strokeStyle=th?'#b8c2d6':'#33466e';ctx.lineWidth=th?2:1;
    ctx.beginPath();ctx.moveTo(cluW+i*cs,cluH);ctx.lineTo(cluW+i*cs,cluH+N*cs);ctx.moveTo(cluW,cluH+i*cs);ctx.lineTo(cluW+N*cs,cluH+i*cs);ctx.stroke()}
}
function msg(s){document.getElementById('msg').textContent=s}
function checkSolved(){
  for(let r=0;r<N;r++){if(JSON.stringify(clues(st[r].map(v=>v===1?1:0)))!==JSON.stringify(rc[r]))return false}
  for(let c=0;c<N;c++){if(JSON.stringify(clues(st.map(r=>r[c]===1?1:0)))!==JSON.stringify(cc[c]))return false}
  return true;
}
function win(){solved=true;document.getElementById('winName').textContent=pic.n;document.getElementById('win').style.display='block';
  // reveal picture in gold
  shown=true;draw()}
// pointer
let dragVal=null,dragging=false;
function cellAt(e){const b=cv.getBoundingClientRect(),x=e.clientX-b.left-cluW,y=e.clientY-b.top-cluH;
  if(x<0||y<0)return null;const c=Math.floor(x/cs),r=Math.floor(y/cs);return(r<N&&c<N)?[r,c]:null}
function apply(rc_){if(!rc_)return;const [r,c]=rc_;if(locked[r][c]||solved||shown)return;st[r][c]=dragVal;draw()}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(solved||shown)return;const cell=cellAt(e);if(!cell)return;
  wrong=null;msg('');
  const t=(e.button===2)?'cross':tool,want=t==='fill'?1:2,cur=st[cell[0]][cell[1]];
  if(locked[cell[0]][cell[1]]){msg('That square is given.');return}
  dragVal=(cur===want)?0:want;dragging=true;cv.setPointerCapture(e.pointerId);apply(cell)});
cv.addEventListener('pointermove',e=>{if(dragging)apply(cellAt(e))});
function up(){if(!dragging)return;dragging=false;if(checkSolved())win()}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
// buttons
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('on'));b.classList.add('on');sizeF=b.dataset.size;bag=[];start()});
document.getElementById('tFill').onclick=()=>{tool='fill';tFill.classList.add('on');tCross.classList.remove('on')};
document.getElementById('tCross').onclick=()=>{tool='cross';tCross.classList.add('on');tFill.classList.remove('on')};
document.getElementById('bNew').onclick=start;document.getElementById('winNew').onclick=start;
document.getElementById('bClear').onclick=()=>{if(solved)return;shown=false;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!locked[r][c])st[r][c]=0;wrong=null;msg('');draw()};
document.getElementById('bShow').onclick=()=>{if(solved)return;shown=!shown;msg(shown?'Showing the answer. Press again to go back.':'');draw()};
document.getElementById('bCheck').onclick=()=>{if(solved||shown)return;wrong=sol.map((row,r)=>row.map((v,c)=>st[r][c]===1&&!v));
  const n=wrong.flat().filter(Boolean).length;msg(n?n+(n===1?' square is':' squares are')+' wrong (shown in red).':'No mistakes so far. Keep going!');draw();
  if(!n)wrong=null;else setTimeout(()=>{wrong=null;draw()},2500)};
window.addEventListener('resize',layout);
start();
</script></body></html>
